name: CI

on:
  push:
    branches: [main, revisao-geral]
  pull_request:
    branches: [main, revisao-geral]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # "npm run lint" fica de fora por enquanto: falha com 8 problemas conhecidos,
      # que serão corrigidos na fase de limpeza do frontend (ver docs/REVISAO.md).
      - run: npm run build
