# Perfil padrão para rodar local sem configurar nada. Os valores abaixo são falsos de propósito.

# H2 em arquivo: cria 'wavedb' na raiz do projeto backend
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:file:./wavedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

api.security.token.secret=dev-only-nao-usar-em-producao

app.admin.email=admin@wave.com
app.admin.password=dev-only-nao-usar-em-producao

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
