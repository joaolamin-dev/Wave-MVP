# O perfil test evita carregar application-dev.properties, que teria prioridade sobre este arquivo
# e levaria a suíte para o banco local (./wavedb).
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:wave_test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

api.security.token.secret=test-only-nao-usar-em-producao

app.admin.email=admin.seed@wave.com
app.admin.password=test-only-nao-usar-em-producao
